<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · {{ loja_nome }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="/static/img/logo.png">
</head>
<body>
  <div class="login-tela">
    <div class="login-caixa">
      <img src="/static/img/logo.png" alt="" class="login-logo"
           onerror="this.outerHTML='<span style=\'font-size:42px\'>🦸</span>'">
      <h1>{{ loja_nome }}</h1>
      <p>Painel de pedidos</p>

      {% if erro %}
        <p class="erro">Senha incorreta. Tente de novo.</p>
      {% endif %}

      <form method="post" action="/admin/login">
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required autofocus
                 autocomplete="current-password">
        </div>
        <button type="submit" class="botao-principal">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
